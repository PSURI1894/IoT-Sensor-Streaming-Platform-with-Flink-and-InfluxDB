version: '3.8'

services:
  # MQTT Broker
  emqx:
    image: emqx/emqx:5.1.1
    container_name: emqx_sandbox
    ports:
      - "1883:1883" # MQTT Port
      - "18083:18083" # Dashboard UI
    environment:
      EMQX_NAME: emqx_sandbox
      EMQX_HOST: 127.0.0.1
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message Broker Backend
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper_sandbox
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_sandbox
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Postgres Registry with CDC Enablement
  postgres:
    image: postgres:15
    container_name: postgres_sandbox
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: device_registry
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - ./postgres/init-device-registry.sql:/docker-entrypoint-initdb.d/init-device-registry.sql
      - ./postgres/cdc-setup.sql:/docker-entrypoint-initdb.d/cdc-setup.sql

  # Time-Series Hot Database
  influxdb:
    image: influxdb:2.7
    container_name: influxdb_sandbox
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password1234
      DOCKER_INFLUXDB_INIT_ORG: factory_iot
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry_hot
      DOCKER_INFLUXDB_INIT_RETENTION: 7d

  # Redis Deduplicator Cache
  redis:
    image: redis:7.0
    container_name: redis_sandbox
    ports:
      - "6379:6379"

  # MinIO Lakehouse Mock S3
  minio:
    image: minio/minio:RELEASE.2023-05-18T00-05-36Z
    container_name: minio_sandbox
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana_sandbox
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

  # Flink Stateful Cluster
  flink-jobmanager:
    image: flink:1.18.0-scala_2.12
    container_name: flink_jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager

  flink-taskmanager:
    image: flink:1.18.0-scala_2.12
    container_name: flink_taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
